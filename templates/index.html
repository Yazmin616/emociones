<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento de Emociones</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-4">Reconocimiento de Emociones</h1>
        <div class="card shadow">
            <div class="card-body">
                <form id="uploadForm" method="POST" enctype="multipart/form-data" action="/upload">
                    <div class="mb-3">
                        <label for="image" class="form-label">Sube tu imagen:</label>
                        <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analizar Emoción</button>
                </form>
            </div>
        </div>
        <div id="result" class="mt-4"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('uploadForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const response = await fetch('/upload', { method: 'POST', body: formData });
            const data = await response.json();
            const resultDiv = document.getElementById('result');
            if (data.error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
            } else {
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h5>Resultado: ${data.result}</h5>
                        <img src="${data.image}" alt="Processed Image" class="img-fluid mt-2">
                    </div>`;
            }
        });
    </script>
</body>
</html>
